name: catalog-build

# Rebuilds the card catalog from TCGdex, cross-checks English against
# pokemon-tcg-data, and (optionally) downloads card images and builds the
# visual index. Run manually after a new set releases, or weekly, or by
# pushing a change to .github/catalog-build-request.json (lets automation that
# can push but can't dispatch workflows request a build).
on:
  push:
    paths: [".github/catalog-build-request.json"]
  workflow_dispatch:
    inputs:
      images:
        description: "Also download images and build the visual index"
        type: boolean
        default: false
      langs:
        description: "Languages"
        default: "en,ja"
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
      - run: pip install -e .
      - name: Resolve options
        id: opts
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            images=$(jq -r '.images // false' ../.github/catalog-build-request.json)
            langs=$(jq -r '.langs // "en,ja"' ../.github/catalog-build-request.json)
          else
            images="${{ inputs.images || false }}"
            langs="${{ inputs.langs || 'en,ja' }}"
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "langs=$langs" >> "$GITHUB_OUTPUT"
          echo "images=$images langs=$langs"
      - name: Build catalog
        run: python -m binderswap.catalog.build --langs "${{ steps.opts.outputs.langs }}"
      - name: Cross-check English
        run: python -m binderswap.catalog.crosscheck
      # Images persist between runs, so a rerun only fetches new or failed ones.
      - name: Restore image cache
        if: ${{ steps.opts.outputs.images == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: pipeline/build/images
          key: card-images-${{ github.run_id }}
          restore-keys: card-images-
      - name: Download images (high resolution webp, for the index)
        id: fetch
        if: ${{ steps.opts.outputs.images == 'true' }}
        run: python -m binderswap.images.fetch --langs "${{ steps.opts.outputs.langs }}" --ext webp --rate 10 --retry-errors
      - name: Save image cache
        if: ${{ always() && steps.opts.outputs.images == 'true' && steps.fetch.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: pipeline/build/images
          key: card-images-${{ github.run_id }}
      - name: Image summary
        if: ${{ always() && steps.opts.outputs.images == 'true' && steps.fetch.outcome != 'skipped' }}
        run: |
          python -m binderswap.images.summary | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh build/images
      - name: Build visual index
        if: ${{ steps.opts.outputs.images == 'true' }}
        run: python -m binderswap.images.index --langs "${{ steps.opts.outputs.langs }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: catalog
          if-no-files-found: ignore
          path: |
            pipeline/build/catalog/catalog.sqlite
            pipeline/build/catalog/REPORT.md
            pipeline/build/catalog/CROSSCHECK.md
            pipeline/build/catalog/packs/
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.opts.outputs.images == 'true' }}
        with:
          name: visual-index
          retention-days: 30
          if-no-files-found: ignore
          path: |
            pipeline/build/index/
            pipeline/build/images/manifest.sqlite
