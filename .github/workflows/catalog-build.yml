name: catalog-build

# Rebuilds the card catalog from TCGdex, cross-checks English against
# pokemon-tcg-data, and (optionally) downloads card images and builds the
# visual index. Run manually after a new set releases, or weekly.
on:
  workflow_dispatch:
    inputs:
      images:
        description: "Also download images and build the visual index"
        type: boolean
        default: false
      langs:
        description: "Languages"
        default: "en,ja"
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
      - run: pip install -e .
      - name: Build catalog
        run: python -m binderswap.catalog.build --langs "${{ inputs.langs || 'en,ja' }}"
      - name: Cross-check English
        run: python -m binderswap.catalog.crosscheck
      - name: Download images (high resolution webp, for the index)
        if: ${{ inputs.images }}
        run: python -m binderswap.images.fetch --langs "${{ inputs.langs || 'en,ja' }}" --ext webp --rate 10 --retry-errors
      - name: Build visual index
        if: ${{ inputs.images }}
        run: python -m binderswap.images.index --langs "${{ inputs.langs || 'en,ja' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: |
            pipeline/build/catalog/catalog.sqlite
            pipeline/build/catalog/REPORT.md
            pipeline/build/catalog/CROSSCHECK.md
            pipeline/build/catalog/packs/
      - name: Image summary
        if: ${{ always() && inputs.images }}
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sqlite3
          con = sqlite3.connect("build/images/manifest.sqlite")
          print("| lang | status | images |\n|---|---|---|")
          for lang, status, n in con.execute(
                  "SELECT substr(card_id,1,2), status, count(*) FROM images GROUP BY 1,2 ORDER BY 1,2"):
              print(f"| {lang} | {status} | {n} |")
          PY
          du -sh build/images
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.images }}
        with:
          name: visual-index
          retention-days: 30
          path: |
            pipeline/build/index/
            pipeline/build/images/manifest.sqlite
