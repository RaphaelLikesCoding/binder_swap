[project]
name = "binderswap-pipeline"
version = "0.1.0"
description = "Binder Swap data pipeline: card catalog, reference images, recognition prototype"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.setuptools.packages.find]
include = ["binderswap*"]
